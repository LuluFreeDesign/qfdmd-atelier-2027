<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Que faire de mon équipe produit en 2027 ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --noir:#000; --encre:#000; --encre-2:#333; --gris:#e4e4e4; --gris-2:#767676; --fond:#fff; --blanc:#fff;
  --vert:#00594F; --vert-fonce:#003D36; --nuit:#000; --turquoise:#00C7B3; --menthe:#E6F4F1; --menthe-2:#E6F4F1; --menthe-3:#00675C;
  --corail:#C23A33; --corail-texte:#A8261F; --corail-pale:#FCEBEA; --ligne:#000;
  --titre:"Bricolage Grotesque","Schibsted Grotesk",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;color:#000;background:#fff;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:#000;text-decoration-thickness:2px;text-underline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid #000;outline-offset:3px}
h1,h2,h3{font-family:var(--titre);color:#000;margin:0;letter-spacing:-.025em}
h1{font-size:44px;line-height:1.08;font-weight:700}
h1.hero{font-size:clamp(40px,6.4vw,84px);line-height:1;letter-spacing:-.04em;max-width:15ch}
h2{font-size:22px;line-height:1.2;font-weight:600}
h3{font-size:17px;line-height:1.3;font-weight:600}
.muted{color:var(--encre-2)}
.small{font-size:13px}

header.top{max-width:1240px;margin:0 auto;padding:22px 32px 0;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:16px}
.qf-logo svg{display:block;height:54px;width:auto}
.logo-txt{display:block}
.logo-txt strong{font-size:22px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.qf-logo{padding-right:16px;border-right:2px solid #000}
#who{font-weight:600;font-size:14px}
.me{display:flex;gap:10px;align-items:center}
.me label{font-size:13px;color:var(--encre-2)}
.me input{border:0;border-bottom:2px solid #000;background:transparent;padding:4px 2px;width:150px;font-weight:600;border-radius:0}
.me input:focus{outline:none;border-bottom-color:var(--vert)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1.5px solid #000;white-space:nowrap}
.pill.ok{border-color:#000;background:#000;color:#fff}
.pill.warn{border-color:var(--corail-texte);color:var(--corail-texte)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

nav.quest{position:sticky;top:0;z-index:30;background:#fff;border-bottom:2px solid #000}
.quest-in{max-width:1240px;margin:0 auto;padding:0 32px;display:flex;align-items:stretch;gap:28px;overflow-x:auto}
.quest a{display:flex;align-items:center;gap:8px;text-decoration:none;color:#333;font-weight:500;font-size:15px;padding:16px 0 13px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.quest a .n{font-size:13px;font-weight:600}
.quest a .n::after{content:"."}
.quest a:hover{color:#000}
.quest a[aria-current="page"]{color:#000;font-weight:700;border-bottom-color:#000}
.quest a.done .n{color:#000}
.quest .link{display:none}
.quest .spacer{flex:1}

main{max-width:1240px;margin:0 auto;padding:36px 32px 100px}
.intro{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:0 0 40px}
.banner{border-left:3px solid #000;padding:8px 14px;margin:0 0 24px;font-size:14px}
.banner.warn{border-left-color:var(--corail-texte)}
.banner p{margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:2px solid #000;background:#000;color:#fff;padding:11px 22px;border-radius:999px;cursor:pointer;font-weight:600;font-size:15px;line-height:1.2;text-decoration:none;transition:background .12s,color .12s}
.btn:hover{background:#fff;color:#000}
.btn.sec{background:#fff;color:#000}
.btn.sec:hover{background:#000;color:#fff}
.btn.sm{padding:6px 14px;font-size:13px}
.btn.icon{width:34px;height:34px;padding:0;font-size:15px}
.btn.ghost{background:transparent;border-color:transparent;color:#000;padding:4px 2px;font-size:14px;border-radius:0;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.btn.ghost:hover{background:transparent;color:var(--vert)}
.btn[disabled]{background:#fff;border:2px dashed #595959;color:#595959;cursor:not-allowed}

.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{border:0;border-bottom:2px solid #000;background:#fff;border-radius:0;padding:8px 2px;min-width:150px;font-weight:500}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-bottom-color:var(--vert)}
.field textarea{min-height:60px;resize:vertical;border:2px solid #000;padding:8px}
.check{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:#000}
.rolebox{display:flex;gap:8px;flex-wrap:wrap}
.rolebox label{display:inline-flex;align-items:center;gap:8px;border:2px solid #000;border-radius:999px;padding:6px 14px;font-weight:500;cursor:pointer}
.rolebox label:has(input:checked){background:#000;color:#fff}
.rolebox input{accent-color:#fff;width:15px;height:15px}

.sz{font-weight:700;font-size:12px}
.chips{display:flex;gap:18px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:baseline;gap:6px;font-size:14px;white-space:nowrap}
.chip b{font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--vert)}
.days{font-weight:700;white-space:nowrap}
ul.contient{margin:0;padding-left:18px;font-size:14px}
ul.contient li{margin:2px 0}

.group{margin:0 0 56px}
.group-h{display:flex;align-items:center;gap:24px;margin:0 0 28px}
.group-h::after{content:"";flex:1;height:2px;background:#000}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));column-gap:48px;row-gap:40px}
.card{display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:2px solid #000}
.card h3{font-size:20px}
.card p.desc{margin:0;font-size:15px}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto}
.panel{border:2px solid #000;padding:24px;margin:0 0 32px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.form-grid .full{grid-column:1/-1}
.form-actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;align-items:center}
.err{color:var(--corail-texte);font-size:14px;font-weight:600;margin:8px 0 0}
.preview{font-size:14px;color:var(--encre-2);margin-top:6px}
details.precis{border-top:2px solid #000;padding-top:12px}
details.precis summary{cursor:pointer;font-weight:600}
.efforts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:12px}
.empty{border-top:2px solid #000;padding:24px 0;font-size:16px}

/* Jauges */
.gauges{display:flex;flex-direction:column;gap:16px}
.gauge{display:grid;grid-template-columns:1fr auto;row-gap:6px;align-items:baseline}
.g-label{font-weight:600;font-size:14px}
.g-num{grid-column:2;grid-row:1;font-size:13px;display:flex;gap:10px;justify-content:flex-end}
.g-num b{font-weight:700}
.g-track{grid-column:1/-1;position:relative;height:10px;background:var(--gris);display:flex;overflow:hidden}
.g-track span{height:100%;display:block}
.g-inc,.lg-inc{background:repeating-linear-gradient(135deg,#000 0 1.5px,transparent 1.5px 5px)}
.g-sel,.lg-sel{background:#000}
.g-over,.lg-over{background:repeating-linear-gradient(45deg,var(--corail) 0 3px,#fff 3px 5px,var(--corail) 5px 8px)}
.g-cap{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--corail-texte)}
.g-num.over{color:var(--corail-texte)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-top:14px;color:var(--encre-2)}
.legend i{display:inline-block;width:14px;height:8px;margin-right:6px;vertical-align:0}
.dark,.light{border-top:2px solid #000;padding-top:18px}
@keyframes wobble{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.gauge.shake .g-track{animation:wobble .25s ease 2}

/* Tri */
.swipe-wrap{display:grid;grid-template-columns:1fr}
.deck{max-width:620px;margin:0 auto;width:100%}
.progress{display:flex;gap:4px;margin:0 0 18px}
.progress{align-items:center}
.progress i{flex:1;height:4px;background:var(--gris)}
.progress i.k{background:#000}
.progress i.l{background:repeating-linear-gradient(90deg,#000 0 3px,#fff 3px 7px)}
.progress i.cur{height:10px;background:#fff;border:2px solid #000}
.stack{position:relative;min-height:340px}
.stack .ghost{display:none}
.scard{position:relative;background:#fff;border:2px solid #000;padding:30px;min-height:340px;display:flex;flex-direction:column;gap:16px;touch-action:pan-y;user-select:none;cursor:grab;will-change:transform}
.scard.dragging{cursor:grabbing}
.scard.fly{transition:transform .28s ease, opacity .28s ease}
.scard h2{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.03em}
.scard .desc{margin:0;font-size:16px}
.scard .cost{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-top:2px solid #000;padding-top:16px}
.scard .big{font-size:40px;font-weight:700;line-height:1;letter-spacing:-.03em}
.stamp{position:absolute;top:26px;padding:4px 12px;font-size:16px;font-weight:700;border:2px solid;opacity:0;pointer-events:none;border-radius:999px}
.stamp.keep{right:26px;color:var(--vert);border-color:var(--vert)}
.stamp.leave{left:26px;color:var(--corail-texte);border-color:var(--corail-texte)}
.choices{display:flex;justify-content:center;gap:40px;margin:28px 0 8px}
.round{width:64px;height:64px;border-radius:50%;border:2px solid #000;background:#fff;color:#000;cursor:pointer;font-size:22px;display:grid;place-items:center;transition:background .12s,color .12s}
.round:hover{background:#000;color:#fff}
.round.keep{background:#000;color:#fff}
.round.keep:hover{background:var(--vert);border-color:var(--vert)}
.choice-lbl{display:flex;justify-content:center;gap:64px;font-size:14px;font-weight:500}

/* Garder ou retirer : titre compact, boutons toujours visibles */
h1.tri-h{font-size:15px;line-height:1.3;margin:-12px 0 10px;color:var(--encre-2);font-weight:600}
.deck .progress{margin-bottom:12px}
.choice-bar{position:sticky;bottom:72px;z-index:7;background:#fff;padding:12px 0 8px;margin-top:8px}
.choice-bar .choices{margin:0 0 6px}
/* Bilan */
.verdict{display:flex;gap:20px;align-items:center;margin:0 0 40px;padding:0}
.verdict .ico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none;border:2px solid}
.verdict.ok .ico{border-color:var(--vert);color:var(--vert)}
.verdict.ko .ico{border-color:var(--corail-texte);color:var(--corail-texte)}
.verdict h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.1}
.verdict.ko h2{color:var(--corail-texte)}
.verdict.ok h2{color:var(--vert)}
.bilan{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:56px;align-items:start}
.sticky{position:sticky;top:76px}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows li{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--gris-2)}
.rows li:first-child{border-top:2px solid #000}
.rows li .t{flex:1;min-width:0}
.rows li .t strong{font-weight:600;font-size:16px;display:block;line-height:1.3}
.rows li.left .t strong{color:var(--encre-2);font-weight:500}
.cost-bar{height:4px;background:#000;margin-top:8px}
.rows li.costly .cost-bar{background:var(--corail)}
.reeval{display:flex;align-items:center;gap:6px;font-size:13px}
.reeval select{border:0;border-bottom:2px solid #000;border-radius:0;padding:2px;background:#fff;font-weight:600}
.reeval.changed select{border-bottom-style:double;border-bottom-width:4px}
.reeval.changed::after{content:"modifié";font-size:12px;font-weight:700;border:1.5px solid #000;border-radius:0;padding:0 6px}
.costbox{border-top:2px solid #000}
.costbox:last-child{border-bottom:2px solid #000}
.costbox summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none;padding:14px 0}
.costbox summary::-webkit-details-marker{display:none}
.costbox summary::before{content:"+";font-weight:700;font-size:20px;width:18px}
.costbox[open] summary::before{content:"–"}
.costbox .ct{flex:1;font-weight:600;font-size:17px}
.costbox .rows li:first-child{border-top:1px solid var(--gris-2)}
.sig{font-size:13px;font-weight:600;white-space:nowrap}
.sig.fort{color:var(--vert)}
.sig.debat{color:#6b4700}
.sig.mino{color:#333}
.sig.over-txt{color:var(--corail-texte)}

/* Top 5 */
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-width:760px}
.rank li{display:flex;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--gris-2);background:#fff}
.rank li:first-child{border-top:2px solid #000}
.rank li.drag{outline:2px dashed #000;outline-offset:-2px;background:#f2f2f2}
.rank li.over{box-shadow:0 -3px 0 #000}
.rank .pos{font-weight:500;font-size:24px;width:44px;letter-spacing:-.03em;color:#333}
.rank li.top .pos{color:#000;font-weight:700;font-size:28px}
.rank .handle{cursor:grab;color:#333;font-size:18px;user-select:none;letter-spacing:-3px}
.rank .t{flex:1;min-width:0}
.rank .t strong{font-weight:600;font-size:16px}
.rank .mv{display:flex;gap:6px}
.cut{max-width:760px;display:flex;align-items:center;gap:14px;margin:24px 0 0;font-size:13px;font-weight:600;color:var(--encre-2)}
.cut::after{content:"";flex:1;height:1px;background:var(--gris-2)}
textarea.code{width:100%;min-height:70px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border:2px solid #000;border-radius:0;padding:8px}

/* Synthèse */
.people{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 24px}
.person{font-size:13px;border:1.5px solid #000;border-radius:999px;padding:2px 12px}
.person.ok{border-color:#000;background:#000;color:#fff}
.tbl{overflow-x:auto;border-top:2px solid #000}
table.syn{width:100%;border-collapse:collapse;font-size:14px}
table.syn th,table.syn td{padding:12px 10px;border-bottom:1px solid var(--gris-2);text-align:left;vertical-align:middle}
table.syn th{font-size:12px;font-weight:600;color:var(--encre-2)}
table.syn td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.share{display:flex;align-items:center;gap:10px}
.share .bar{width:90px;height:6px;background:var(--gris)}
.share .bar span{display:block;height:100%;background:#000}
.team{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.team ul{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px}
.team li{display:flex;gap:10px;align-items:baseline}
.team li .ic{width:24px;flex:none;font-weight:700}
.team li.out{color:var(--encre-2)}
.team li.out .ic{color:var(--corail-texte)}
.team .panel{border:0;border-top:2px solid #000;padding:16px 0 0}
.cols{display:flex;gap:32px;overflow-x:auto;padding-bottom:8px}
.col{flex:0 0 240px;border-top:2px solid #000;padding-top:12px}
.col ol{margin:8px 0 0;padding-left:20px;font-size:14px}
.settings td{padding:6px 10px 6px 0}
.settings input{width:96px;border:0;border-bottom:2px solid #000;padding:4px 2px;border-radius:0}
.settings input.lab{width:240px}

@media (max-width:980px){
  .bilan{grid-template-columns:1fr;gap:32px}
  .bilan > aside{order:-1}
  .sticky{position:static}
}
@media (max-width:640px){
  header.top,main,.quest-in{padding-left:18px;padding-right:18px}
  .form-grid,.team{grid-template-columns:1fr}
  h1{font-size:32px}
  .scard{padding:20px}
  .quest-in{gap:18px}
}
@media (prefers-reduced-motion:reduce){ .gauge.shake .g-track{animation:none} .scard.fly{transition:none} }
@media (forced-colors:active){ .g-track,.g-inc,.g-sel,.g-over,.lg-inc,.lg-sel,.lg-over,.progress i{forced-color-adjust:none} }
.btn,.round{transition:none}

/* ===== Barre d'étapes ===== */
.quest-in{align-items:center}
.step{display:flex;align-items:center;gap:8px;padding:16px 0 13px;font-size:15px;color:#333;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.step .n{display:inline-grid;place-items:center;width:24px;height:24px;border:2px solid #000;font-size:12px;font-weight:700}
.step.cur{color:#000;font-weight:700;border-bottom-color:#000}
.step.cur .n{background:#000;color:#fff}
.step.done .n{background:#fff}
.step-sep{flex:0 0 28px;height:2px;background:#000}
.owner-link{font-size:14px;color:#000;padding:16px 0 13px;margin-left:20px;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.owner-link.on{font-weight:700}
.stepnav{position:sticky;bottom:0;z-index:8;background:#fff;border-top:2px solid #000;margin-top:48px;padding:14px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.prenom-step .field input{font-size:24px;font-weight:600;padding:10px 2px}
/* ===== Ajustements : cartes, boutons carrés, verdict sobre ===== */
h1.hero{font-size:36px;line-height:1.1;letter-spacing:-.03em;max-width:none}
.btn,.btn.sm,.btn.icon,.pill,.person,.rolebox label,.stamp,.round{border-radius:0}
.round{width:58px;height:58px}
.cards{column-gap:20px;row-gap:20px}
.card{border:2px solid #000;padding:20px;background:#fff}
.card.inc{background:repeating-linear-gradient(135deg,#fff 0 9px,#f2f2f2 9px 11px)}
.verdict{display:inline-flex;gap:10px;align-items:center;margin:0 0 28px;padding:10px 16px;border:2px solid currentColor}
.verdict.ko{color:var(--corail-texte)}
.verdict.ok{color:var(--vert)}
.verdict .ico{width:auto;height:auto;border:0;font-size:16px}
/* verdict = bannière d'information, pas un bouton */
.verdict{display:flex;border:0;border-radius:4px;padding:12px 16px}
.verdict.ok{background:var(--menthe)}
.verdict.ko{background:var(--corail-pale)}
.verdict h2{font-size:16px;font-weight:600;letter-spacing:0;line-height:1.3;color:inherit}

/* typo */
body{font-size:16px;line-height:1.55;letter-spacing:0}
h1,h2,h3,.logo-txt strong,.scard h2,.scard .big,.verdict h2,.rank .pos,.costbox .ct{font-family:var(--titre);font-optical-sizing:auto}
h1{letter-spacing:-.02em}
.card h3,.rows li .t strong,.rank .t strong{font-family:var(--titre);font-weight:600;letter-spacing:-.01em}

/* tailles de titres resserrées */
h1{font-size:28px;line-height:1.15;font-weight:700}
h2{font-size:18px;font-weight:700}
h3{font-size:16px;font-weight:700}
.logo-txt strong{font-size:19px}
.card h3{font-size:17px}
.scard{padding:24px;gap:12px;min-height:280px}
.stack{min-height:280px}
.scard h2{font-size:21px;line-height:1.2;letter-spacing:-.01em}
.scard .desc{font-size:15px}
.scard .big{font-size:26px}
.rank .pos,.rank li.top .pos{font-size:18px}
.rank .t strong,.rows li .t strong{font-size:15px}
.costbox .ct{font-size:15px}
.group-h h2{font-size:17px}
.verdict h2{font-size:15px}
/* badge en direct */
.pill.live{border-color:#00453D;color:#00453D;font-weight:700;animation:live-bg 2.4s ease-in-out infinite}
.pill.live .dot{animation:live-dot 2.4s ease-in-out infinite}
@keyframes live-bg{0%,100%{background:#E6F5F1}50%{background:#B9E3D8}}
@keyframes live-dot{0%,100%{background:#5FC7AE}50%{background:#00594F}}
@media (prefers-reduced-motion:reduce){ .pill.live,.pill.live .dot{animation:none} .pill.live{background:#E6F5F1} .pill.live .dot{background:#00594F} }

/* champs de saisie explicites */
.field input,.field select,.field textarea,.settings input,.reeval select,textarea.code{border:2px solid #000;background:#f4f4f4;border-radius:0;padding:10px 12px;color:#000}
.field input:focus,.field select:focus,.field textarea:focus,.settings input:focus,.reeval select:focus{outline:3px solid var(--vert);outline-offset:1px;border-color:#000;background:#fff}
.reeval select{padding:4px 6px}
.reeval.changed select{border-bottom-style:solid;border-bottom-width:2px;border-style:double;border-width:4px}
.prenom-step .field input{font-size:20px;padding:12px 14px}
.stepnav{border-top:1px solid #c4c4c4}

/* cartes adoucies, titres de page plus petits */
.card,.scard{border:2px solid #8f8f8f;border-radius:4px}
h1{font-size:22px;line-height:1.2}
/* poubelle animée */
.bin{display:block;color:#000;flex:none;overflow:visible}
.bin .eye{transform-box:fill-box;transform-origin:center;animation:bin-blink 5s infinite}
.bin .eye+.eye{animation-delay:.04s}
.bin .lid{transform-box:fill-box;transform-origin:8% 100%;transition:transform .25s ease-out}
.bin.wave{margin:0 0 18px}
.bin.wave .lid{animation:bin-lid 5s ease-in-out infinite}
.prenom-step:hover .bin.wave .lid,.prenom-step:focus-within .bin.wave .lid{animation:none;transform:rotate(-14deg) translateY(-4px)}
.bin.hop{animation:bin-hop .8s ease-out 1}
.sent-line{margin:0;display:flex;align-items:center;gap:12px}
.empty{display:flex;align-items:center;gap:14px}
@keyframes bin-blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.12)}96%{transform:scaleY(1)}}
@keyframes bin-lid{0%,70%,100%{transform:none}76%{transform:rotate(-12deg) translateY(-3px)}82%{transform:none}86%{transform:rotate(-6deg)}90%{transform:none}}
@keyframes bin-hop{0%{transform:translateY(0)}30%{transform:translateY(-10px) rotate(-6deg)}55%{transform:translateY(0) rotate(3deg)}75%{transform:translateY(-3px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.bin,.bin .eye,.bin .lid{animation:none!important;transition:none}}
@media (forced-colors:active){.bin{color:CanvasText}}
.imp-top .panel{margin:0 0 32px!important}
[hidden]{display:none!important}

/* ===== Jauges compactes (jours par métier + budget) ===== */
.agrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.ag{display:flex;flex-direction:column;gap:6px;min-width:0}
.ag-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ag-val{font-weight:700;font-size:14px;white-space:nowrap}
.ag-val .muted{font-weight:500}
.ag-st{font-size:13px;color:var(--encre-2)}
.ag.full .ag-st,.ag.over .ag-st{color:var(--corail-texte);font-weight:700}
.ag.full .g-track{outline:2px solid var(--corail-texte);outline-offset:1px}
.ag.shake .g-track{animation:wobble .25s ease 2}
.legend{margin-top:10px}

/* ===== Répartir les jours ===== */
.alloc-head{position:sticky;top:var(--nav-h,58px);z-index:20;background:#fff;padding:14px 0 12px;border-bottom:2px solid #000;margin:0 -2px}
.alloc-head .banner{margin:12px 0 0}
.alloc-head .legend{margin-top:8px}
.acards{display:flex;flex-direction:column;gap:16px}
.acard{border:2px solid #8f8f8f;border-radius:4px;padding:16px 20px;background:#fff;display:flex;flex-direction:column;gap:10px}
.acard.zero{border-style:dashed;border-color:#000}
.acard-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.acard-h h3{font-size:17px}
.acard-h .btn.ghost{flex:none;color:var(--corail-texte)}
.acard-more summary{cursor:pointer;font-weight:600;margin-bottom:4px}
.stps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.stp{display:flex;flex-direction:column;gap:6px;min-width:0}
.stp-l{font-size:13px;font-weight:600}
.stp-c{display:flex;align-items:stretch;border:2px solid #000;border-radius:4px;overflow:hidden;max-width:220px;background:#fff}
.stp-b{flex:none;width:44px;min-height:44px;border:0;background:#fff;color:#000;font-size:22px;font-weight:600;cursor:pointer;line-height:1}
.stp-b:first-child{border-right:2px solid #000}
.stp-b:last-child{border-left:2px solid #000;background:#000;color:#fff}
.stp-b:hover{background:var(--menthe);color:#000}
.stp-b:last-child:hover{background:var(--vert);color:#fff}
.stp-b[disabled]{background:#f2f2f2;color:#9a9a9a;cursor:not-allowed}
.stp-b:focus-visible{outline:3px solid var(--vert);outline-offset:-3px}
.stp-in{flex:1;min-width:0;width:100%;border:0;text-align:right;font-weight:700;font-size:17px;padding:6px 2px 6px 6px;background:#fff}
.stp-in:focus{outline:none;background:#f4f4f4}
.stp-c:focus-within{outline:3px solid var(--vert);outline-offset:1px}
.stp-u{display:flex;align-items:center;padding:0 10px 0 4px;font-weight:600;color:var(--encre-2)}
.stp-e{min-height:1.4em}
.acard-f{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-top:1px solid var(--gris-2);padding-top:8px}
.zero-txt{font-weight:600;color:var(--corail-texte)}
.acard-msg{font-size:13px;font-weight:600;color:var(--corail-texte)}
.inc-rows li{background:repeating-linear-gradient(135deg,#fff 0 9px,#f6f6f6 9px 11px)}
@media (max-width:900px){ .agrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px} }
@media (max-width:640px){
  .alloc-head{padding:10px 0}
  .alloc-head .legend{display:none}
  .ag-st{font-size:12px}
  .ag:not(.full):not(.over) .ag-st{display:none}
  .stps{grid-template-columns:1fr;gap:12px}
  .stp{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px;row-gap:2px}
  .stp-c{max-width:180px}
  .stp-e{grid-column:1/-1;text-align:right}
  .acard{padding:16px}
}
@media (prefers-reduced-motion:reduce){ .ag.shake .g-track{animation:none} }

<script>
(function(){
"use strict";

const SEED = JSON.parse(document.getElementById('seed').textContent);
const LS_KEY = 'qfdmd-atelier-2027-v3';
const CODE_PREFIX = 'QFD27C.';
const SIZE_ORDER = ['XS','S','M','L','XL','XXL'];
const TOP_N = 5;
const MAX_J = 400;
const VIEWS = [
  {id:'prenom', n:1, label:'Prénom'},
  {id:'projets', n:2, label:'Les projets'},
  {id:'tri', n:3, label:'Garder ou retirer'},
  {id:'jours', n:4, label:'Répartir les jours'},
  {id:'top', n:5, label:'Mon top 5'}
];
const ALL_VIEWS = ['prenom','projets','tri','jours','top','synthese','reglages'];

const S = {
  mode:'loading', db:null, user:null, uid:null, isOwner:false, localWrite:false,
  config: SEED.config, projetsDb:[], projetsLoaded:false, choix:{},
  me:{prenom:'', garde:[], laisse:[], top:[], alloc:{}, envoye:false}, meLoaded:false,
  local:{added:[], imports:[], config:null},
  note:'', writeError:'', view:'prenom', rendered:null,
  editing:null, includeEnCours:false, retri:false
};

const $ = (s, el) => (el||document).querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Math.round(n*10)/10).toString().replace('.', ',');
const EUR = (()=>{ try{ return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}); }catch(e){ return {format:n=>Math.round(n)+' €'}; } })();
const eur = n => EUR.format(Math.round(n||0));
const plural = (n, a, b) => n>1 ? b : a;
const rid = () => 'eq-' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const uniq = a => [...new Set(a)];
function animateur(){ try{ const q=new URLSearchParams(location.search); if(q.has('participant')) localStorage.removeItem(LS_KEY+'-anim'); if(q.has('animateur')) localStorage.setItem(LS_KEY+'-anim','1'); return localStorage.getItem(LS_KEY+'-anim')==='1'; }catch(e){ return false; } }
function lsLoad(){ try{ const v = JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(v && typeof v==='object') return v; }catch(e){} return null; }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({me:S.me, local:S.local})); }catch(e){} }
function announce(t){ const l=$('#live'); l.textContent=''; setTimeout(()=>{l.textContent=t;},30); }
function cssEsc(s){ return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g,'\\$&'); }

/* ---------- Modèle ---------- */
function cfg(){ return (S.config && Array.isArray(S.config.roles) && S.config.roles.length && S.config.tailles) ? S.config : SEED.config; }
function roles(){ return cfg().roles; }
function roleCodes(){ return roles().map(r=>r.code); }
function role(code){ return roles().find(r=>r.code===code) || {code, label:code, court:code, jours:0, poids:1}; }
function court(code){ const r=role(code); return r.court||r.label; }
function maxAjouts(){ return Number(cfg().maxAjouts)||5; }
function sizes(){
  const t = cfg().tailles;
  return Object.keys(t).sort((a,b)=>{ const ia=SIZE_ORDER.indexOf(a), ib=SIZE_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || (Number(t[a])-Number(t[b])); }).map(k=>[k, Number(t[k])||0]);
}
function tailleJ(t){ if(typeof t==='number') return isFinite(t)&&t>=0?t:0; const e=sizes().find(x=>x[0]===t); return e?e[1]:0; }
const r05 = x => Math.round(x*2)/2;

function cleanProjet(raw, id){
  if(!raw || typeof raw!=='object') return null;
  const codes=roleCodes(), sz=sizes().map(x=>x[0]);
  const efforts={};
  if(raw.efforts && typeof raw.efforts==='object') for(const [k,v] of Object.entries(raw.efforts)) if(codes.includes(k) && (sz.includes(v) || (typeof v==='number' && isFinite(v) && v>=0 && v<=400))) efforts[k]=v;
  const rl = Array.isArray(raw.roles) ? raw.roles.filter(r=>codes.includes(r)) : [];
  const taille = sz.includes(raw.taille) ? raw.taille : null;
  let precis = !!raw.precis && Object.keys(efforts).length>0;
  if(!precis && !(taille && rl.length) && Object.keys(efforts).length) precis = true;
  return {
    id:String(id||raw.id||''), titre:String(raw.titre||'Sans titre').slice(0,160), desc:String(raw.desc||'').slice(0,600),
    contient: Array.isArray(raw.contient) ? raw.contient.map(x=>String(x).slice(0,200)).slice(0,12) : [],
    socle:!!raw.socle, precis, efforts, taille: taille||'M', roles: rl.length?rl:['DEV'],
    origine: raw.origine==='equipe'?'equipe':'base', auteur: raw.auteur?String(raw.auteur):'', auteurPrenom: raw.auteurPrenom?String(raw.auteurPrenom).slice(0,40):'',
    ordre: Number(raw.ordre)||1000, cree: Number(raw.cree)||0, local: !!raw.local
  };
}
/* Jours par rôle d'un projet, avec réévaluation éventuelle (taille globale) */
function baseDays(p){
  const res={};
  if(p.precis){ for(const [k,v] of Object.entries(p.efforts)) res[k]=tailleJ(v); return res; }
  const tot=tailleJ(p.taille); const ws=p.roles.map(r=>Number(role(r).poids)||1); const sum=ws.reduce((a,b)=>a+b,0)||1;
  p.roles.forEach((r,i)=>{ res[r]=r05(tot*ws[i]/sum); });
  return res;
}
function sumDays(d){ return Object.values(d).reduce((a,b)=>a+b,0); }
/* Temps incompressible : jours fixés dans la liste. Projets à arbitrer : jours répartis par la personne (zéro au départ). */
function days(p, alloc){
  if(p.socle) return baseDays(p);
  const o = alloc && alloc[p.id]; const res={};
  if(o && typeof o==='object') for(const k of roleCodes()){ const v=Number(o[k]); if(v>0) res[k]=v; }
  return res;
}
function total(p, alloc){ return sumDays(days(p, alloc)); }
/* Coût en euros */
function tjm(code){ const r=role(code); if(isFinite(Number(r.tjm)) && Number(r.tjm)>=0 && r.tjm!==null && r.tjm!=='') return Number(r.tjm); const s=SEED.config.roles.find(x=>x.code===code); return s&&Number(s.tjm)||0; }
function euros(d){ let t=0; for(const k in d) t+=d[k]*tjm(k); return t; }
function cost(p, alloc){ return euros(days(p, alloc)); }
function budget(){ const b=Number(cfg().budget); if(cfg().budget!=null && cfg().budget!=='' && isFinite(b) && b>0) return b; return roles().reduce((t,r)=>t+(Number(r.jours)||0)*tjm(r.code),0); }
function cleanAlloc(e){
  const out={}; if(!e || typeof e!=='object') return out;
  for(const [k,v] of Object.entries(e)){
    if(!v || typeof v!=='object') continue;
    const o={}; for(const [r,n] of Object.entries(v)){ const x=Number(n); if(isFinite(x) && x>0 && x<=MAX_J) o[String(r).slice(0,12)]=r05(x); }
    if(Object.keys(o).length) out[String(k).slice(0,80)]=o;
  }
  return out;
}

function allProjets(){
  const base = S.mode==='shared' ? S.projetsDb : SEED.projets.map(c=>cleanProjet(c));
  const extra = S.localWrite ? S.local.added.map(c=>cleanProjet(Object.assign({}, c, {local:true}))).filter(Boolean) : [];
  const ids=new Set(base.map(c=>c.id));
  return base.concat(extra.filter(c=>!ids.has(c.id))).sort((a,b)=>(a.ordre-b.ordre)||(a.cree-b.cree));
}
function byId(){ const m={}; for(const c of allProjets()) m[c.id]=c; return m; }
function jeux(){ return allProjets().filter(p=>!p.socle); }

/* Charge par rôle + budget en euros (clé spéciale « € ») */
function load(ids, alloc){
  const map=byId(); const res={};
  for(const r of roles()) res[r.code]={cap:Number(r.jours)||0, inc:0, sel:0};
  for(const p of Object.values(map)) if(p.socle){ const d=days(p); for(const k in d) if(res[k]) res[k].inc+=d[k]; }
  for(const id of ids){ const p=map[id]; if(!p||p.socle) continue; const d=days(p, alloc); for(const k in d) if(res[k]) res[k].sel+=d[k]; }
  let incE=0, selE=0;
  for(const k in res){ const x=res[k]; x.total=x.inc+x.sel; x.over=Math.max(0,x.total-x.cap); x.free=x.cap-x.total; incE+=x.inc*tjm(k); selE+=x.sel*tjm(k); }
  const cap=budget(); const tot=incE+selE;
  Object.defineProperty(res,'€',{value:{cap, inc:incE, sel:selE, total:tot, over:Math.max(0,tot-cap), free:cap-tot}, enumerable:false});
  return res;
}
function overRoles(L){ return Object.entries(L).filter(([k,x])=>x.over>0.0001).map(([k,x])=>({code:k, over:x.over})); }
function overBudget(L){ return L['€'].over>0.5; }
function wouldOver(L, p, alloc){ const out=[]; const d=days(p, alloc); for(const k in d){ const x=L[k]; if(!x) continue; const after=x.total+d[k]; if(after>x.cap+0.0001) out.push({code:k, over:Math.min(after-x.cap, d[k])}); } if(L['€'] && L['€'].total+euros(d)>L['€'].cap+0.5) out.push({code:'€', over:0}); return out; }
/* Combien de jours peut-on encore ajouter sur ce rôle (plafond du rôle et du budget) ? */
function roomFor(L, code){
  const x=L[code]; if(!x) return 0;
  let room=Math.max(0, x.cap-x.total);
  const t=tjm(code); if(t>0) room=Math.min(room, Math.max(0, L['€'].free)/t);
  return Math.floor(room*2+1e-6)/2;
}

function garde(){ const m=byId(); return S.me.garde.filter(id=>m[id]&&!m[id].socle); }
function laisse(){ const m=byId(); return S.me.laisse.filter(id=>m[id]&&!m[id].socle); }
function aTrier(){ const g=new Set(garde()), l=new Set(laisse()); return jeux().filter(p=>!g.has(p.id)&&!l.has(p.id)); }
function topList(){ const g=garde(); const t=S.me.top.filter(id=>g.includes(id)); return t.concat(g.filter(id=>!t.includes(id))); }
function myLoad(){ return load(garde(), S.me.alloc); }
function sansJours(){ const m=byId(); return garde().filter(id=>!total(m[id], S.me.alloc)); }
function fits(){ if(!garde().length) return false; const L=myLoad(); return !overRoles(L).length && !overBudget(L) && !sansJours().length; }
function freeAlloc(id){ if(S.me.alloc[id]) delete S.me.alloc[id]; }
function mesAjouts(){ return allProjets().filter(p=>p.origine==='equipe' && (p.local || (S.uid && p.auteur===S.uid))).length; }

/* ---------- Codes de secours ---------- */
function b64e(str){ const b=new TextEncoder().encode(str); let s=''; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const bin=atob(s); const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return new TextDecoder().decode(b); }
function packProjet(p){ return {id:p.id,titre:p.titre,desc:p.desc}; }
function myCode(){
  const g=garde(); const m=byId();
  const added=g.map(id=>m[id]).filter(p=>p && p.origine==='equipe' && (p.local || p.auteur===S.uid)).map(packProjet);
  return CODE_PREFIX + b64e(JSON.stringify({p:S.me.prenom||'', g, t:topList().slice(0,TOP_N), a:S.me.alloc, c:added}));
}
function parseCodes(text){
  const out=[], errs=[];
  for(const part of String(text||'').split(/\s+/).filter(Boolean)){
    if(!part.startsWith(CODE_PREFIX)){ errs.push(part); continue; }
    try{
      const o=JSON.parse(b64d(part.slice(CODE_PREFIX.length)));
      if(!o || !Array.isArray(o.g)) throw new Error('format');
      out.push({prenom:String(o.p||'Anonyme').slice(0,40), garde:o.g.map(String).slice(0,200), top:Array.isArray(o.t)?o.t.map(String).slice(0,TOP_N):[], alloc:cleanAlloc(o.a),
        projets:(Array.isArray(o.c)?o.c:[]).slice(0,maxAjouts()).map(c=>cleanProjet(Object.assign({}, c, {origine:'equipe', auteurPrenom:o.p||''}))).filter(Boolean)});
    }catch(e){ errs.push(part); }
  }
  return {out, errs};
}
function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }

/* ---------- Enregistrement ---------- */
let saveTimer=null, saving=false, saveAgain=false;
function changed(){ S.me.envoye=false; saveMe(); }
function saveMe(){ lsSave(); if(S.mode!=='shared'||S.localWrite||!S.uid) return; clearTimeout(saveTimer); saveTimer=setTimeout(flushMe, 500); }
async function flushMe(){
  if(saving){ saveAgain=true; return; }
  saving=true;
  try{ await S.db.doc('choix/'+S.uid).set({prenom:S.me.prenom||'', garde:garde(), laisse:laisse(), top:topList().slice(0,TOP_N), alloc:S.me.alloc, envoye:!!S.me.envoye, maj:Date.now()}); S.writeError=''; }
  catch(e){
    if(e && (e.code==='invalid_argument'||e.code==='quota_exceeded')) switchToLocalWrite();
    else S.writeError="Vos derniers choix n'ont pas pu être enregistrés dans la base partagée. Nouvel essai au prochain changement.";
    renderBanners();
  }
  saving=false; if(saveAgain){ saveAgain=false; flushMe(); }
}
function switchToLocalWrite(){ if(S.localWrite) return; S.localWrite=true; lsSave(); renderBanners(); renderBadge(); render(true); }

/* ---------- Connexion ---------- */
function cleanMe(m){
  const arr = a => Array.isArray(a) ? a.map(String) : [];
  const alloc = cleanAlloc(m && m.alloc);
  return {prenom:String((m&&m.prenom)||'').slice(0,40), garde:arr(m&&m.garde), laisse:arr(m&&m.laisse), top:arr(m&&m.top), alloc, envoye:!!(m&&m.envoye), importe:!!(m&&m.importe)};
}
async function connect(){
  const local=lsLoad();
  if(local){
    if(local.me) S.me=cleanMe(local.me);
    if(local.local && typeof local.local==='object'){ S.local.added=Array.isArray(local.local.added)?local.local.added:[]; S.local.imports=Array.isArray(local.local.imports)?local.local.imports:[]; S.local.config=local.local.config||null; }
  }
  renderWho();
  let db=null, user=null;
  try{ if(window.claude && typeof window.claude.use==='function'){ [db,user]=await Promise.all([window.claude.use('db'), window.claude.use('user')]); } }catch(e){ db=null; }
  if(!db){ goLocal(); return; }
  let uid=null; try{ uid=user?await user.id():null; }catch(e){}
  S.db=db; S.user=user; S.uid=uid; S.mode='shared';
  try{ S.isOwner = user ? !!(await Promise.resolve(user.isOwner())) : false; }catch(e){}
  let canW=null; try{ canW = user&&user.can ? await Promise.resolve(user.can('data.write')) : null; }catch(e){}
  if(!uid || canW===false) S.localWrite=true;
  subscribe(); renderBadge(); renderBanners(); render(true);
}
function goLocal(){ S.mode='local'; S.isOwner=animateur(); S.localWrite=true; S.projetsLoaded=true; S.meLoaded=true; if(S.local.config) S.config=S.local.config; renderBadge(); renderBanners(); render(true); }
function subscribe(){
  let got=false;
  const timer=setTimeout(()=>{ if(!got){ S.note="La base partagée ne répond pas encore. Vérifiez votre connexion : la page se mettra à jour toute seule."; renderBanners(); } },10000);
  S.db.doc('config/main').onSnapshot(snap=>{ if(snap.exists){ const d=snap.data(); if(d && Array.isArray(d.roles) && d.tailles) S.config=d; } render(); }, ()=>{});
  S.db.collection('projets').onSnapshot(snap=>{
    S.projetsDb=snap.docs.map(d=>cleanProjet(d.data(), d.id)).filter(Boolean);
    if(!snap.metadata.fromCache){ got=true; clearTimeout(timer); S.note=''; renderBanners(); }
    S.projetsLoaded=true; render();
  }, ()=>{ clearTimeout(timer); S.note="Impossible de lire les projets partagés."; S.projetsLoaded=true; renderBanners(); render(); });
  S.db.collection('choix').onSnapshot(snap=>{
    const m={}; for(const d of snap.docs){ const v=d.data(); if(v) m[d.id]=cleanMe(v); }
    S.choix=m;

/* ----- Jauges ----- */
function gaugeCell(o){
  const {key,label,x,unit,shake}=o; const f = unit==='€' ? eur : (n=>fmt(n)+' j');
  const den=Math.max(x.cap,x.total,1);
  const pInc=Math.min(x.inc,x.cap)/den*100; const selIn=Math.max(0,Math.min(x.sel,x.cap-x.inc)); const pSel=selIn/den*100; const pOver=x.over/den*100;
  const full = x.over<=0.0001 && (unit==='€' ? x.free<1 : x.free<0.5);
  const state = x.over>0.0001 ? 'over' : full ? 'full' : '';
  const status = x.over>0.0001 ? '⚠ '+f(x.over)+' de trop' : full ? 'Plus rien de libre' : f(x.free)+(unit==='€'?' restants':' libres');
  const lab=`${label} : ${f(x.total)} sur ${f(x.cap)}, ${status}`;
  return `<div class="ag ${state} ${shake?'shake':''}" data-g="${esc(key)}" role="img" aria-label="${esc(lab)}">
    <div class="ag-top" aria-hidden="true"><span class="g-label">${esc(label)}</span><b class="ag-val">${f(x.total)} <span class="muted">/ ${f(x.cap)}</span></b></div>
    <span class="g-track" aria-hidden="true"><span class="g-inc" style="width:${pInc}%"></span>${pSel>0?`<span class="g-sel" style="width:${pSel}%"></span>`:''}${pOver>0?`<span class="g-over" style="width:${pOver}%"></span>`:''}${x.over>0?`<span class="g-cap" style="left:calc(${x.cap/den*100}% - 1px)"></span>`:''}</span>
    <span class="ag-st" aria-hidden="true">${status}</span></div>`;
}
function gaugesHtml(L, opts){
  opts=opts||{}; const sh=opts.shake||[];
  return `<div class="agrid">${roles().map(r=>gaugeCell({key:r.code,label:court(r.code),x:L[r.code],unit:'j',shake:sh.includes(r.code)})).join('')}${gaugeCell({key:'€',label:'Budget produit',x:L['€'],unit:'€',shake:sh.includes('€')})}</div>

function decide(id, keep){
  const p=byId()[id]; if(!p) return;
  S.me.garde=garde().filter(x=>x!==id); S.me.laisse=laisse().filter(x=>x!==id);
  (keep?S.me.garde:S.me.laisse).push(id); if(!keep) freeAlloc(id); changed();
  announce((keep?'Gardé : ':'Retiré : ')+p.titre);
  if(!aTrier().length){ S.retri=false; if(garde().length){ go('jours'); renderSteps(); return; } }
  fillTri(); renderSteps();
  const k=document.querySelector('.round.keep'); if(k) k.focus();
}
function fly(keep){
  const c=$('#scard'); if(!c) return; const id=c.dataset.id;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ decide(id, keep); return; }
  c.classList.add('fly'); c.style.transform=`translateX(${keep?520:-520}px) rotate(${keep?18:-18}deg)`; c.style.opacity='0';
  $(keep?'#st-keep':'#st-leave').style.opacity='1';
  setTimeout(()=>decide(id, keep), 230);
}
function bindSwipe(){
  const c=$('#scard'); if(!c) return;
  let x0=null, dx=0, pid=null;
  c.addEventListener('pointerdown', e=>{ if(e.button!==0) return; x0=e.clientX; dx=0; pid=e.pointerId; c.classList.add('dragging'); try{c.setPointerCapture(pid);}catch(_){} });
  c.addEventListener('pointermove', e=>{ if(x0===null) return; dx=e.clientX-x0; c.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`; $('#st-keep').style.opacity=Math.max(0,Math.min(1,dx/110)); $('#st-leave').style.opacity=Math.max(0,Math.min(1,-dx/110)); });
  const end=()=>{ if(x0===null) return; c.classList.remove('dragging'); x0=null;
    if(Math.abs(dx)>110){ fly(dx>0); } else { c.classList.add('fly'); c.style.transform=''; $('#st-keep').style.opacity=0; $('#st-leave').style.opacity=0; setTimeout(()=>c.classList.remove('fly'),280); } };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
}
document.addEventListener('keydown', e=>{

  const t=e.target; if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT')) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); fly(true); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); fly(false); }
});

/* Ce qui bloque l'ajout sur un rôle : le plafond du métier ou le budget en euros */
function limitBy(L, code){ const x=L[code]; const roleRoom=Math.max(0,x.cap-x.total); const t=tjm(code); return (t>0 && Math.max(0,L['€'].free)/t < roleRoom) ? '€' : code; }
function setAlloc(id, code, want, src){
  const p=byId()[id]; if(!p||p.socle) return;
  const cur=(S.me.alloc[id]&&Number(S.me.alloc[id][code]))||0;
  const L=myLoad(); const maxV=cur+roomFor(L,code);
  let v=Math.max(0, Math.min(MAX_J, r05(want))); let capped=false;
  if(v>cur && v>maxV){ v=maxV; capped=true; }
  const o=Object.assign({}, S.me.alloc[id]||{}); if(v>0) o[code]=v; else delete o[code];
  if(Object.keys(o).length) S.me.alloc[id]=o; else delete S.me.alloc[id];
  if(v!==cur) changed();
  const why = capped ? limitBy(L, code) : null;
  refreshJours(capped?[why]:[]);
  const msg=document.querySelector(`#jours-body .acard[data-card="${cssEsc(id)}"] [data-msg]`);
  const txt = capped ? `Bloqué à ${fmt(v)} j : ${why==='€'?'le budget est atteint':'plus de jours libres en '+court(code)}.` : '';
  if(msg) msg.textContent = txt;
  if(capped) announce(txt);
  else if(src==='btn') announce(`${court(code)} : ${fmt(v)} ${plural(v,'jour','jours')} sur « ${p.titre} »`);
}

function setOrder(list){ S.me.top=list.slice(0,TOP_N); S.me.garde=list.slice(); changed(); fillTop(); renderSteps(); }
function move(id,d){ const s=topList(); const i=s.indexOf(id), j=i+d; if(i<0||j<0||j>=s.length) return; [s[i],s[j]]=[s[j],s[i]]; setOrder(s);

/* ----- Synthèse (animateur) ----- */
function participants(){
  const list=[];
  if(S.mode==='shared') for(const [id,v] of Object.entries(S.choix)){ if(id===S.uid&&S.localWrite) continue; list.push(Object.assign({id}, v, {prenom:v.prenom||'Sans prénom'})); }
  if(S.localWrite){
    if(S.me.garde.length) list.push(Object.assign({id:'moi'}, S.me, {prenom:(S.me.prenom||'Vous')+' (cet appareil)', garde:garde(), top:topList().slice(0,TOP_N)}));
    for(const im of S.local.imports) list.push(Object.assign({}, im, {envoye:true, importe:true}));
  }
  return list;
}
function computeSynthese(){
  const m=byId();
  const ps=participants().filter(p=>p.envoye||S.includeEnCours).map(p=>{ const g=(p.garde||[]).filter(id=>m[id]&&!m[id].socle); return Object.assign({},p,{garde:g, top:(p.top||[]).filter(id=>g.includes(id)).slice(0,TOP_N)}); }).filter(p=>p.garde.length);
  const N=ps.length; const st={};
  for(const p of jeux()) st[p.id]={p, n:0, ntop:0, score:0, sum:{}, min:Infinity, max:0};
  for(const x of ps){
    for(const id of x.garde){ const s=st[id]; if(!s) continue; s.n++; s.score+=1; const d=days(s.p, x.alloc); for(const k in d) s.sum[k]=(s.sum[k]||0)+d[k]; const tt=sumDays(d); s.min=Math.min(s.min,tt); s.max=Math.max(s.max,tt); }
    x.top.forEach((id,i)=>{ const s=st[id]; if(!s) return; s.ntop++; s.score+=TOP_N-i; });
  }
  /* Jours moyens alloués par celles et ceux qui ont gardé le projet */
  const avg={};
  for(const s of Object.values(st)){ if(!s.n){ s.min=0; continue; } const o={}; for(const k in s.sum){ const v=r05(s.sum[k]/s.n); if(v>0) o[k]=v; } avg[s.p.id]=o; }
  const rows=Object.values(st).sort((a,b)=>b.score-a.score||b.n-a.n||a.p.titre.localeCompare(b.p.titre));
  const teamSel=[], out=[];
  for(const s of rows){ if(!s.n) continue; const wo=wouldOver(load(teamSel, avg), s.p, avg); if(wo.length) out.push({s,wo}); else teamSel.push(s.p.id); }
  return {ps,N,rows,teamSel,out,avg};
}
function signal(n,N){ if(!N||!n) return ''; const r=n/N; if(r>=.75) return `<span class="sig fort">Consensus</span>`; if(r>=.4) return `<span class="sig debat">À débattre</span>`; return `<span class="sig mino">Minoritaire</span>`; }
function fillSynthese(){

  const voted=rows.filter(s=>s.n), zero=rows.filter(s=>!s.n);
  h+=`<h2 style="margin:6px 0 10px">Classement collectif</h2><div class="tbl"><table class="syn"><thead><tr><th>#</th><th>Projet</th><th>Gardé par</th><th style="text-align:right">Dans un top ${TOP_N}</th><th style="text-align:right">Score</th><th style="text-align:right">Jours (moyenne)</th><th>Détail moyen</th><th style="text-align:right">Coût moyen</th><th>Signal</th></tr></thead><tbody>
    ${voted.map((s,i)=>`<tr><td class="num"><span class="days">${i+1}</span></td><td><strong>${esc(s.p.titre)}</strong></td>
      <td><div class="share"><div class="bar"><span style="width:${s.n/N*100}%"></span></div><span class="small">${s.n}/${N}</span></div></td>
      <td class="num">${s.ntop}</td><td class="num"><span class="days">${s.score}</span></td><td class="num">${fmt(total(s.p,avg))} j${s.n>1&&s.max>s.min?`<div class="small muted">de ${fmt(s.min)} à ${fmt(s.max)} j</div>`:''}</td>
      <td class="small">${Object.entries(days(s.p,avg)).map(([k,v])=>esc(court(k))+' '+fmt(v)+' j').join('<br>')}</td><td class="num">${eur(cost(s.p,avg))}</td><td>${signal(s.n,N)}</td></tr>`).join('')}
    </tbody></table></div>`;
  if(zero.length) h+=`<p class="small muted" style="margin:10px 0 0"><strong>Personne ne les a gardés :</strong> ${zero.map(s=>esc(s.p.titre)).join(', ')}.</p>`;
  h+=`<h2 style="margin:26px 0 6px">Panier d'équipe proposé</h2>
    <p class="small muted" style="margin:0 0 10px">Projets pris dans l'ordre du classement, avec les jours moyens alloués, tant que ça rentre.</p>
    <div class="panel light">${gaugesHtml(load(teamSel, avg),{team:true})}</div>
    <div class="team"><div class="panel"><h3>Ça rentre</h3><ul>${teamSel.map((id,i)=>`<li><span class="ic">${i+1}.</span><span>${esc(m[id].titre)} <span class="muted small">(${fmt(total(m[id],avg))} j · ${eur(cost(m[id],avg))})</span></span></li>`).join('')||'<li class="muted">Rien pour l\'instant.</li>'}</ul></div>
    <div class="panel"><h3>Ne rentre pas, malgré des votes</h3><ul>${out.map(o=>`<li class="out"><span class="ic">✕</span><span>${esc(o.s.p.titre)} <span class="small">(${o.s.n}/${N}, bloqué par ${o.wo.map(w=>esc(wcode(w.code))).join(', ')})</span></span></li>`).join('')||'<li class="muted">Tout ce qui a été gardé rentre.</li>'}</ul></div></div>`;
  h+=`<h2 style="margin:26px 0 10px">Le top ${TOP_N} de chacun et chacune</h2><div class="cols">${ps.map(p=>`<div class="col"><h3>${esc(p.prenom)}</h3><ol>${p.top.map(id=>`<li>${esc(m[id].titre)}</li>`).join('')}</ol>${p.garde.length>p.top.length?`<p class="small muted" style="margin:6px 0 0">+ ${p.garde.length-p.top.length} autre${p.garde.length-p.top.length>1?'s':''} gardé${p.garde.length-p.top.length>1?'s':''}</p>`:''}</div>`).join('')}</div>`;
  $('#syn-body').innerHTML=h;
}
function synTsv(){
  const {N,rows,teamSel,avg}=computeSynthese();
  const head=['Rang','Projet','Gardé par','Dans un top 5','Score','Jours (moyenne)'].concat(roles().map(r=>court(r.code)+' (moyenne)'),['Coût moyen (€)',"Dans le panier d'équipe"]);
  const lines=rows.map((s,i)=>{ const d=days(s.p,avg); return [s.n?i+1:'', s.p.titre, s.n+'/'+N, s.ntop, s.score, fmt(total(s.p,avg))].concat(roles().map(r=>fmt(d[r.code]||0)),[Math.round(cost(s.p,avg)), teamSel.includes(s.p.id)?'oui':'non']); });
  return [head].concat(lines).map(l=>l.map(v=>String(v).replace(/[\t\n]/g,' ')).join('\t')).join('\n');
}

async function doImport(){

  const existing=byId();
  for(const im of out){
    const pid='import-'+hashStr(im.prenom.toLowerCase());
    if(S.mode==='shared'&&!S.localWrite){
      try{
        for(const p of im.projets) if(!existing[p.id]) await S.db.collection('projets').doc(p.id).set(Object.assign(packProjet(p),{contient:[],origine:'equipe',auteur:'',auteurPrenom:im.prenom,ordre:500,cree:Date.now(),socle:false}));
        await S.db.doc('choix/'+pid).set({prenom:im.prenom, garde:im.garde, laisse:[], top:im.top, alloc:im.alloc, envoye:true, importe:true, maj:Date.now()});
      }catch(e){ err.textContent="L'import de "+im.prenom+' a échoué.'; return; }
    } else {
      for(const p of im.projets) if(!existing[p.id] && !S.local.added.some(x=>x.id===p.id)) S.local.added.push(Object.assign(packProjet(p),{local:true, origine:'equipe', auteurPrenom:im.prenom}));
      S.local.imports=S.local.imports.filter(x=>x.id!==pid).concat([{id:pid, prenom:im.prenom, garde:im.garde, top:im.top, alloc:im.alloc}]); lsSave();
    }
  }
  $('#imp-text').value=''; err.textContent=errs.length?errs.length+' code(s) ignoré(s) car illisibles.':'';
  announce(out.length+' import(s) réussi(s).'); render();
}

/* ----- Réglages ----- */
function renderSettings(){
  const el=$('#settings'); if(!el) return; const canSave=S.localWrite||S.isOwner;
  el.innerHTML=`<form class="panel" id="set-form">
    <h2>Rôles</h2>
    
    <table class="settings"><thead><tr><th class="small">Rôle</th><th class="small">Jours</th><th class="small">Coût jour (€)</th></tr></thead><tbody>${roles().map((r,i)=>`<tr><td><input class="lab" data-rl="${i}" value="${esc(r.label)}" aria-label="Nom du rôle ${i+1}"></td><td><input type="number" min="0" step="1" data-rj="${i}" value="${esc(r.jours)}" aria-label="Jours pour ${esc(r.label)}"></td><td><input type="number" min="0" step="10" data-rt="${i}" value="${esc(tjm(r.code))}" aria-label="Coût jour pour ${esc(r.label)}"></td></tr>`).join('')}</tbody></table>
    <h2 style="margin-top:18px">Budget annuel (€)</h2>
    <div class="field" style="max-width:220px;margin-top:8px"><label for="budget">Laisser vide pour : jours × coût jour</label><input type="number" min="0" step="1000" id="budget" value="${cfg().budget!=null&&cfg().budget!==''?esc(cfg().budget):''}" placeholder="${Math.round(roles().reduce((t,r)=>t+(Number(r.jours)||0)*tjm(r.code),0))}"></div>
    <h2 style="margin-top:18px">Tailles (jours)</h2>
    <table class="settings"><tbody><tr>${sizes().map(([k,v])=>`<td><label for="tz-${esc(k)}" class="small" style="font-weight:800">${esc(k)}</label><br><input type="number" min="0" step="0.5" id="tz-${esc(k)}" data-tz="${esc(k)}" value="${esc(v)}"></td>`).join('')}</tr></tbody></table>
    <h2 style="margin-top:18px">Ajouts par personne</h2>
    <div class="field" style="max-width:160px;margin-top:8px"><label for="max-aj">Maximum</label><input type="number" min="0" step="1" id="max-aj" value="${maxAjouts()}"></div>
    <p class="err" id="set-err" role="alert"></p>
    <div class="form-actions"><button class="btn" type="submit" ${canSave?'':'disabled'}>Enregistrer les réglages</button></div></form>`;
}
async function saveSettings(){
  const rs=roles().map((r,i)=>Object.assign({},r,{label:(document.querySelector(`[data-rl="${i}"]`).value.trim()||r.label).slice(0,60), jours:Math.max(0,Number(document.querySelector(`[data-rj="${i}"]`).value)||0), tjm:Math.max(0,Number(document.querySelector(`[data-rt="${i}"]`).value)||0)}));
  const tz={}; document.querySelectorAll('[data-tz]').forEach(inp=>{ tz[inp.dataset.tz]=Math.max(0,Number(inp.value)||0); });
  const bv=$('#budget').value.trim(); const c=Object.assign({}, cfg(), {roles:rs, tailles:tz, maxAjouts:Math.max(0,Math.round(Number($('#max-aj').value)||0)), budget: bv===''?null:Math.max(0,Number(bv)||0)}); const msg=$('#set-err');
  if(S.localWrite){ S.local.config=c; S.config=c; lsSave(); }
  else { try{ await S.db.doc('config/main').set(c); S.config=c; }catch(e){ msg.textContent='Enregistrement impossible.'; return; } }
  msg.style.color='var(--vert-fonce)'; msg.textContent='Réglages enregistrés.'; announce('Réglages enregistrés.');
}

function submitName(){
  const v=($('#name-input').value||'').trim().slice(0,40); const err=$('#name-err');
  if(!v){ err.textContent='Indiquez votre prénom.'; $('#name-input').focus(); return; }
  S.me.prenom=v; renderWho(); saveMe(); go('projets');
}
/* ---------- Événements ---------- */
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==='new') openForm('new');
  else if(act==='edit'){ openForm(id); const fp=$('#form-panel'); if(fp.scrollIntoView) fp.scrollIntoView({behavior:'smooth',block:'start'}); }
  else if(act==='cancel'){ S.editing=null; $('#form-panel').innerHTML=''; fillProjets(); }
  else if(act==='del'){ S.confirmDel=id; fillProjets(); }
  else if(act==='del-no'){ S.confirmDel=null; fillProjets(); }
  else if(act==='del-ok') deleteProjet(id);
  else if(act==='keep') fly(true);
  else if(act==='leave') fly(false);
  else if(act==='to-bilan'){ S.forceBilan=true; renderRecap(); }
  else if(act==='continue'){ S.forceBilan=false; fillTri(); }
  else if(act==='retri'){ S.me.laisse=[]; S.me.garde=[]; S.me.top=[]; S.me.alloc={}; S.forceBilan=false; changed(); fillTri(); renderSteps(); }
  else if(act==='leave-r'||act==='leave-j'){ S.me.garde=garde().filter(x=>x!==id); S.me.laisse=laisse().filter(x=>x!==id).concat([id]); freeAlloc(id); changed(); if(act==='leave-r') renderRecap(); else { fillJours(); const h=$('#jours-body h2'); if(h){ h.setAttribute('tabindex','-1'); h.focus(); } } renderSteps(); announce('Projet retiré, ses jours sont libérés.'); }
  else if(act==='keep-r'||act==='keep-j'){ S.me.laisse=laisse().filter(x=>x!==id); S.me.garde=garde().filter(x=>x!==id).concat([id]); freeAlloc(id); changed(); if(act==='keep-r') renderRecap(); else { fillJours(); const i=document.querySelector(`#jours-body input[data-alloc="${cssEsc(id)}"]`); if(i) i.focus(); } renderSteps(); announce('Projet remis, à zéro jour.'); }
  else if(act==='plus'||act==='minus'){ const cur=(S.me.alloc[id]&&S.me.alloc[id][b.dataset.role])||0; setAlloc(id, b.dataset.role, cur+(act==='plus'?PAS:-PAS), 'btn'); if(b.disabled){ const o=b.parentNode.querySelector(`[data-act="${act==='plus'?'minus':'plus'}"]`); if(o&&!o.disabled) o.focus(); else { const i=b.parentNode.querySelector('input'); if(i) i.focus(); } } }
  else if(act==='to-top') go('top');
  else if(act==='go'){ e.preventDefault(); go(b.dataset.to); }
  else if(act==='name-ok') submitName();
  else if(act==='up') move(id,-1);
  else if(act==='down') move(id,1);
  else if(act==='send'){ if(!S.me.prenom.trim()||!fits()) return; S.me.top=topList().slice(0,TOP_N); S.me.envoye=true; saveMe(); if(S.mode==='shared'&&!S.localWrite){ clearTimeout(saveTimer); flushMe(); } announce(S.mode==='local'?'Code prêt.':'Choix envoyés.'); fillTop(); if(S.mode==='local'){ const c=$('#my-code'); if(c) c.focus(); } renderSteps(); }
  else if(act==='copy-code'){ const t=$('#my-code'); t.select(); try{ navigator.clipboard.writeText(t.value).then(()=>{b.textContent='Code copié ✓';},()=>announce('Sélectionnez le code et copiez-le.')); }catch(_){ announce('Sélectionnez le code et copiez-le.'); } }
  else if(act==='copy-syn'){ try{ navigator.clipboard.writeText(synTsv()).then(()=>{b.textContent='Tableau copié ✓';},()=>{b.textContent='Copie refusée par le navigateur';}); }catch(_){ b.textContent='Copie refusée par le navigateur'; } }
  else if(act==='import') doImport();
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset && t.dataset.alloc){ commitAlloc(t); return; }
  if(t.id==='p-socle'){ const z=$('#p-socle-j'); if(z) z.hidden=!t.checked; }
  if(t.id==='s-encours'){ S.includeEnCours=t.checked; fillSynthese(); }
});
function commitAlloc(inp){
  inp.dataset.dirty='';
  const raw=String(inp.value).trim().replace(',','.').replace(/\s*j(ours?)?$/i,'');
  const v = raw==='' ? 0 : Number(raw);
  if(!isFinite(v) || v<0){ const msg=document.querySelector(`#jours-body .acard[data-card="${cssEsc(inp.dataset.alloc)}"] [data-msg]`); if(msg) msg.textContent='Indiquez un nombre de jours, par exemple 2,5.'; refreshJours(); return; }
  setAlloc(inp.dataset.alloc, inp.dataset.role, v, 'input');
}
document.addEventListener('input', e=>{ const t=e.target; if(t.dataset && t.dataset.alloc) t.dataset.dirty='1'; });
document.addEventListener('keydown', e=>{
  const t=e.target; if(!t.dataset || !t.dataset.alloc) return;
  if(e.key==='Enter'){ e.preventDefault(); commitAlloc(t); t.select&&t.select(); }
  else if(e.key==='ArrowUp'||e.key==='ArrowDown'){ e.preventDefault(); const cur=(S.me.alloc[t.dataset.alloc]&&S.me.alloc[t.dataset.alloc][t.dataset.role])||0; setAlloc(t.dataset.alloc, t.dataset.role, cur+(e.key==='ArrowUp'?PAS:-PAS), 'btn'); }
});
document.addEventListener('focusin', e=>{ const t=e.target; if(t.dataset && t.dataset.alloc && t.select) setTimeout(()=>{ try{ t.select(); }catch(_){} },0); });
document.addEventListener('submit', e=>{ e.preventDefault(); if(e.target.id==='name-form') submitName(); if(e.target.id==='p-form') submitForm(); if(e.target.id==='set-form') saveSettings(); });

window.addEventListener('hashchange', route);

route();
connect();
})();
</script>
</body>
</html>
